<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Camera & Mic Toggle</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            background: #121212;
            color: #e0e0e0;
        }
        h2 { color: #f0f0f0; }
        .video-wrap {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin-top: 5vw;
        }
        video {
            background: #000;
            border-radius: 8px;
            border: 1px solid #333;
            width: min(90vw, 960px);
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 14px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .device-control {
            position: relative;
            display: flex;
            align-items: stretch;
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid #444;
            border-radius: 22px;
        }
        .icon-btn, .caret-btn {
            background: transparent;
            border: none;
            color: #e0e0e0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 22px 0 0 22px;
        }
        .caret-btn {
            width: 24px;
            border-left: 1px solid #444;
            border-radius: 0 22px 22px 0;
        }
        .icon-btn:hover, .caret-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .device-control.off .icon-btn { background: #d93025; color: #fff; }
        .device-control.off .icon-btn:hover { background: #b3261e; }
        .device-menu {
            position: absolute;
            bottom: 52px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 220px;
            max-width: 70vw;
            background: #1e1e1e;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 4px;
            display: none;
            z-index: 10;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
        .device-menu.open { display: block; }
        .device-menu button {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 12px;
            background: none;
            border: none;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .device-menu button:hover { background: #2d2d2d; }
        .device-menu button.selected { color: #8ab4f8; }
    </style>
</head>
<body>
    <div class="video-wrap">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="controls">
            <div class="device-control off" id="camControl">
                <button class="icon-btn" id="camBtn" title="Turn camera on"></button>
                <button class="caret-btn" id="camCaret" title="Select camera"></button>
                <div class="device-menu" id="camMenu"></div>
            </div>
            <div class="device-control off" id="micControl">
                <button class="icon-btn" id="micBtn" title="Turn microphone on"></button>
                <button class="caret-btn" id="micCaret" title="Select microphone"></button>
                <div class="device-menu" id="micMenu"></div>
            </div>
        </div>
    </div>

    <script>
        const ICONS = {
            camOn: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
            camOff: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/></svg>',
            micOn: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>',
            micOff: '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V20c0 .55.45 1 1 1s1-.45 1-1v-2.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z"/></svg>',
            caret: '<svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>'
        };

        let camStream = null;
        let micStream = null;
        let audioCtx = null;
        let selectedCamId = null;
        let selectedMicId = null;
        const videoElement = document.getElementById('webcam');
        const camBtn = document.getElementById('camBtn');
        const micBtn = document.getElementById('micBtn');
        const camCaret = document.getElementById('camCaret');
        const micCaret = document.getElementById('micCaret');
        const camMenu = document.getElementById('camMenu');
        const micMenu = document.getElementById('micMenu');
        const camControl = document.getElementById('camControl');
        const micControl = document.getElementById('micControl');

        camBtn.innerHTML = ICONS.camOff;
        micBtn.innerHTML = ICONS.micOff;
        camCaret.innerHTML = ICONS.caret;
        micCaret.innerHTML = ICONS.caret;

        function setControlState(control, btn, onIcon, offIcon, onTitle, offTitle, isOn) {
            control.classList.toggle('off', !isOn);
            btn.innerHTML = isOn ? onIcon : offIcon;
            btn.title = isOn ? onTitle : offTitle;
        }

        function buildMenu(menu, devices, fallbackName, selectedId, onPick) {
            menu.innerHTML = '';
            devices.forEach((d, i) => {
                const item = document.createElement('button');
                item.textContent = d.label || fallbackName + ' ' + (i + 1);
                item.classList.toggle('selected', d.deviceId === selectedId);
                item.onclick = () => { onPick(d.deviceId); closeMenus(); };
                menu.appendChild(item);
            });
        }

        async function listDevices() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const cams = devices.filter(d => d.kind === 'videoinput');
            const mics = devices.filter(d => d.kind === 'audioinput');
            if (!selectedCamId && cams.length) selectedCamId = cams[0].deviceId;
            if (!selectedMicId && mics.length) selectedMicId = mics[0].deviceId;
            buildMenu(camMenu, cams, 'Camera', selectedCamId, async id => {
                selectedCamId = id;
                if (camStream) { await toggleCam(); await toggleCam(); }
                listDevices();
            });
            buildMenu(micMenu, mics, 'Mic', selectedMicId, async id => {
                selectedMicId = id;
                if (micStream) { await toggleMic(); await toggleMic(); }
                listDevices();
            });
        }

        function closeMenus() {
            camMenu.classList.remove('open');
            micMenu.classList.remove('open');
        }

        camCaret.onclick = e => {
            e.stopPropagation();
            const wasOpen = camMenu.classList.contains('open');
            closeMenus();
            if (!wasOpen) camMenu.classList.add('open');
        };
        micCaret.onclick = e => {
            e.stopPropagation();
            const wasOpen = micMenu.classList.contains('open');
            closeMenus();
            if (!wasOpen) micMenu.classList.add('open');
        };
        document.addEventListener('click', closeMenus);

        async function toggleCam() {
            if (camStream) {
                camStream.getTracks().forEach(t => t.stop());
                camStream = null;
                videoElement.srcObject = null;
                setControlState(camControl, camBtn, ICONS.camOn, ICONS.camOff,
                    'Turn camera off', 'Turn camera on', false);
            } else {
                try {
                    camStream = await navigator.mediaDevices.getUserMedia({
                        video: selectedCamId ? { deviceId: { exact: selectedCamId } } : true
                    });
                    videoElement.srcObject = camStream;
                    setControlState(camControl, camBtn, ICONS.camOn, ICONS.camOff,
                        'Turn camera off', 'Turn camera on', true);
                } catch (err) {
                    alert("Camera access denied or not available: " + err);
                }
            }
        }

        async function toggleMic() {
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
                if (audioCtx) { audioCtx.close(); audioCtx = null; }
                setControlState(micControl, micBtn, ICONS.micOn, ICONS.micOff,
                    'Turn microphone off', 'Turn microphone on', false);
            } else {
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: selectedMicId ? { deviceId: { exact: selectedMicId } } : true
                    });
                    setControlState(micControl, micBtn, ICONS.micOn, ICONS.micOff,
                        'Turn microphone off', 'Turn microphone on', true);
                } catch (err) {
                    alert("Mic access denied or not available: " + err);
                }
            }
        }

        camBtn.onclick = toggleCam;
        micBtn.onclick = toggleMic;

        // Get permission (so labels are visible), then list devices.
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(s => { s.getTracks().forEach(t => t.stop()); listDevices(); })
            .catch(() => listDevices());
    </script>
</body>
</html>
