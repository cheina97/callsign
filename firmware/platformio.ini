; PlatformIO project configuration for the callsign ESP32 firmware.
; Build:    pio run            (or: make firmware-build)
; Upload:   pio run -t upload  (with the ESP32 connected via USB)
; Monitor:  pio device monitor

; The sketch lives in firmware/callsign/ (Arduino-style layout)
[platformio]
src_dir = callsign

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; MAX7219 LED matrix driver (installs MD_Parola dependency automatically)
lib_deps = majicdesigns/MD_MAX72XX@^3.5.1

monitor_speed = 115200
