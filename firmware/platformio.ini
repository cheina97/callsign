; PlatformIO project configuration for the callsign ESP32 firmware.
; Build:    pio run            (or: make firmware-build)
; Upload:   pio run -t upload  (with the ESP32 connected via USB)
; Monitor:  pio device monitor

; The sketch lives in firmware/callsign/ (Arduino-style layout)
; esp32dev is the default build/upload env; native is only used explicitly
; for host-side unit tests (pio test -e native / make firmware-test)
[platformio]
src_dir = callsign
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Generate callsign/wifi_config.h from ../.env before building
extra_scripts = pre:gen_wifi_config.py

; WS2812B (NeoPixel) addressable LED driver
lib_deps = fastled/FastLED@^3.7.0

monitor_speed = 115200

; Static analysis (pio check / make firmware-check). Library code (FastLED)
; is pulled into the sketch's compilation unit; its findings are excluded
; via cppcheck-suppressions.txt so only our code is reported.
check_tool = cppcheck
check_flags = --enable=warning,performance,portability --inline-suppr
              --suppressions-list=cppcheck-suppressions.txt
check_skip_packages = yes
check_severity = low, medium, high

; Host-side unit tests: pure display logic compiled for the Mac, no ESP32
; needed. Run with: pio test -e native (or: make firmware-test)
[env:native]
platform = native
build_flags = -std=c++11
build_src_filter = +<display_logic.h>
test_build_src = yes
