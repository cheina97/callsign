name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    name: Vet, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Vet
        working-directory: client
        run: go vet ./...

      - name: Test
        working-directory: client
        run: go test ./...

      - name: Build all packages
        working-directory: client
        run: go build ./...

  client-binaries:
    # The client only runs on macOS (system_profiler + unified log),
    # so it is cross-compiled for darwin and published as an artifact.
    name: Build macOS client binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Build darwin/amd64 and darwin/arm64
        working-directory: client
        run: |
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/callsign-client-darwin-amd64 ./cmd/callsign-client
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/callsign-client-darwin-arm64 ./cmd/callsign-client

      - uses: actions/upload-artifact@v4
        with:
          name: callsign-client-darwin
          path: client/dist/
